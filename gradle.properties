# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft Properties
# we support all 1.21 versions but since parchment only has 1.21.1 we use that instead of plain 1.21
minecraft_version=1.21.11
# exclude @zip for parchment version
# todo: this is currently for 1.21.10, when mappings release for 11 update to those
parchment_version=2025.10.12

# Mod properties
mod_version=3.1
maven_group=io.github.fifthtundrag.namereplace
archives_name=namereplace
enabled_platforms=fabric,neoforge

# Dependencies
fabric_loader_version=0.18.2
neoforge_version=21.11.6-beta
# carpet mod is runtime only for easier testing
carpet_version=1.4.193